<!DOCTYPE html>
<html>
<head>
  <title>Login</title>

  <style>
    /* Default for all elements */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
    }

    div {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }

    form {
      display: flex;
      flex-direction: column;
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #login_submit {
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: black 1px solid;
      border-radius: 5px;
      cursor: pointer;
    }

    #login_submit:hover {
      background-color: #ffffff;
      color: #007BFF;
    }

    input {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    #scanner_btn {
      padding: 10px;
      background-color: #111;
      color: white;
      border: 1px solid black;
      border-radius: 5px;
      cursor: pointer;
    }

    #scanner_btn:hover {
      background-color: white;
      color: #111;
    }

    .error {
      color: red;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Login</h1>

  <div>
    <form action="{% url 'login' %}" method="post">
      {% csrf_token %}

      <label for="username">Stall name:</label>
      <br>
      <input type="text" id="username" name="username" required>

      <label for="password">Password:</label>
      <br>
      <input type="password" id="password" name="password" required>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <button type="submit" id="login_submit">Login</button>

      <br>

      <button type="button" id="scanner_btn">
        Go To QR Scanner
      </button>
    </form>
  </div>

  <script>
    document.getElementById("scanner_btn").addEventListener("click", () => {
      window.location.href = "{% url 'mainpage' %}";
    });
  </script>

</body>
</html>
